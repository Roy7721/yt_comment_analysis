name : CI Pipeline

on:
    push:
        branches: [master]

permissions:
  contents: write

jobs:
    model_workflow:
        runs-on: ubuntu-latest
        steps:
            - uses: actions/checkout@v4

            - name: Set up Python 3.11
              uses: actions/setup-python@v5
              with:
                  python-version: "3.11"


            - name: cache pip
              uses: actions/cache@v4
              with:
                path: ~/.cache/pip
                key: ${{ runner.os }}-pip-${{ hashFiles('requirements.txt') }}
                restore-keys: |
                    ${{ runner.os }}-pip-
            
            - name: Install dependencies                
              run: |
                python -m pip install --upgrade pip
                pip install -r requirements.txt
                python -m spacy download en_core_web_sm

            - name: Reproduce DVC pipeline
              env:                                         
                MLFLOW_TRACKING_USERNAME: ${{ secrets.MLFLOW_TRACKING_USERNAME }}
                MLFLOW_TRACKING_PASSWORD: ${{ secrets.MLFLOW_TRACKING_PASSWORD }}
              run: dvc repro

            - name: Sync dvc.lock back to repo
              run: |
                git config user.name "github-actions[bot]"
                git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
                git add dvc.lock
                if git diff --cached --quiet; then
                  echo "dvc.lock unchanged - nothing to commit."
                else
                  git commit -m "CI: sync dvc.lock from pipeline run [skip ci]"
                  git push origin HEAD:master
                fi

            - name: Pre-promotion gate (test freshly trained model)
              env:
                MLFLOW_TRACKING_USERNAME: ${{ secrets.MLFLOW_TRACKING_USERNAME }}
                MLFLOW_TRACKING_PASSWORD: ${{ secrets.MLFLOW_TRACKING_PASSWORD }}
              run: python tests/test_model.py

            - name: Register & promote model to staging
              env:
                MLFLOW_TRACKING_USERNAME: ${{ secrets.MLFLOW_TRACKING_USERNAME }}
                MLFLOW_TRACKING_PASSWORD: ${{ secrets.MLFLOW_TRACKING_PASSWORD }}
              run: python src/models/register_model.py

            - name: Push DVC artifacts to DagShub
              env:
                DVC_USER: ${{ secrets.MLFLOW_TRACKING_USERNAME }}
                DVC_PASS: ${{ secrets.MLFLOW_TRACKING_PASSWORD }}
              run: |
                dvc remote modify origin --local auth basic
                dvc remote modify origin --local user "$DVC_USER"
                dvc remote modify origin --local password "$DVC_PASS"
                dvc push

            - name: Set up Docker Buildx
              uses: docker/setup-buildx-action@v3

            - name: Log in to Docker Hub
              uses: docker/login-action@v3
              with:
                username: ${{ secrets.DOCKERHUB_USERNAME }}
                password: ${{ secrets.DOCKERHUB_TOKEN }}

            - name: Build and push image to Docker Hub
              uses: docker/build-push-action@v6
              with:
                context: .
                file: ./Dockerfile
                push: true
                tags: |
                  ${{ secrets.DOCKERHUB_USERNAME }}/yt-sentiment-api:latest
                  ${{ secrets.DOCKERHUB_USERNAME }}/yt-sentiment-api:${{ github.sha }}
            

            

            
