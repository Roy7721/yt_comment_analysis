name : CI Pipeline

on:
    push:
        branches: [master]

jobs:
    model_workflow:
        runs-on: ubuntu-latest
        steps:
            - uses: actions/checkout@v4

            - name: Set up Python 3.11
              uses: actions/setup-python@v5
              with:
                  python-version: "3.11"


            - name: cache pip
              uses: actions/cache@v4
              with:
                path: ~/.cache/pip
                key: ${{ runner.os }}-pip-${{ hashFiles('requirements.txt') }}
                restore-keys: |
                    ${{ runner.os }}-pip-
            
            - name: Install dependencies                
              run: |
                python -m pip install --upgrade pip
                pip install -r requirements.txt
                python -m spacy download en_core_web_sm

            - name: Reproduce DVC pipeline
              env:                                         
                MLFLOW_TRACKING_USERNAME: ${{ secrets.MLFLOW_TRACKING_USERNAME }}
                MLFLOW_TRACKING_PASSWORD: ${{ secrets.MLFLOW_TRACKING_PASSWORD }}
              run: dvc repro

            - name: Pre-promotion gate (test freshly trained model)
              env:
                MLFLOW_TRACKING_USERNAME: ${{ secrets.MLFLOW_TRACKING_USERNAME }}
                MLFLOW_TRACKING_PASSWORD: ${{ secrets.MLFLOW_TRACKING_PASSWORD }}
              run: python tests/test_model.py

            - name: Register & promote model to staging
              env:
                MLFLOW_TRACKING_USERNAME: ${{ secrets.MLFLOW_TRACKING_USERNAME }}
                MLFLOW_TRACKING_PASSWORD: ${{ secrets.MLFLOW_TRACKING_PASSWORD }}
              run: python src/models/register_model.py

            - name: Push DVC artifacts to DagShub
              env:
                DVC_USER: ${{ secrets.MLFLOW_TRACKING_USERNAME }}
                DVC_PASS: ${{ secrets.MLFLOW_TRACKING_PASSWORD }}
              run: |
                dvc remote modify origin --local auth basic
                dvc remote modify origin --local user "$DVC_USER"
                dvc remote modify origin --local password "$DVC_PASS"
                dvc push

            

            

            
